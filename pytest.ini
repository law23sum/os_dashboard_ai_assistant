[pytest]
# Pytest configuration for OS Dashboard AI Assistant

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --cov=backend_api
    --cov=assistant_core
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=60

# Asyncio configuration
asyncio_mode = auto

# Markers (defined in conftest.py)
markers =
    e2e: End-to-end integration tests
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_network: Tests requiring network access
    requires_database: Tests requiring database

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test.log
log_file_level = DEBUG

# Coverage
[coverage:run]
source = backend_api,assistant_core
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
