version: '3.8'

# OS Dashboard AI Assistant Docker Compose
# Use profiles to control which services run:
# - Default: Basic development setup
# - full: Complete production stack with monitoring
# - gui: Desktop GUI mode

services:
  # Main OS Dashboard Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: os-dashboard-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:osdashboard123@postgres:5432/osdashboard
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      # Persist the shared (desktop + web) SQLite store under /app/data
      # so projects/tasks/settings survive container restarts.
      - ASSISTANT_HUB_DATA_DIR=/app/data
      - ASSISTANT_HUB_DB=/app/data/assistant_hub.db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./file_cache:/app/file_cache
    networks:
      - os_dashboard_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - default
      - full

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: os-dashboard-postgres
    environment:
      POSTGRES_DB: osdashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: osdashboard123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:z
    ports:
      - "5432:5432"
    networks:
      - os_dashboard_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - default
      - full

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: os-dashboard-redis
    command: redis-server --appendonly yes --requirepass osdashboard123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - os_dashboard_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - default
      - full

  # Celery Worker for Background Tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: os-dashboard-celery-worker
    command: celery -A assistant_core.daemon.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:osdashboard123@postgres:5432/osdashboard
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ASSISTANT_HUB_DATA_DIR=/app/data
      - ASSISTANT_HUB_DB=/app/data/assistant_hub.db
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - os_dashboard_network
    restart: unless-stopped
    profiles:
      - default
      - full

  # GUI Application (Desktop Mode)
  gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: os-dashboard-gui
    environment:
      - DISPLAY=${DISPLAY}
      - DATABASE_URL=postgresql://postgres:osdashboard123@postgres:5432/osdashboard
      - REDIS_URL=redis://redis:6379
      - ASSISTANT_HUB_DATA_DIR=/app/data
      - ASSISTANT_HUB_DB=/app/data/assistant_hub.db
    volumes:
      - .:/app
      - ./config:/app/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      - postgres
      - redis
    networks:
      - os_dashboard_network
    command: python assistant_hub_gui/main.py
    profiles:
      - gui

  # ===== ADVANCED SERVICES (use with --profile full) =====

  # Elasticsearch for Advanced Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: os-dashboard-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - os_dashboard_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - full

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: os-dashboard-celery-beat
    command: celery -A assistant_core.daemon.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:osdashboard123@postgres:5432/osdashboard
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - celery_beat_data:/app/celerybeat-schedule
    networks:
      - os_dashboard_network
    restart: unless-stopped
    profiles:
      - full

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: os-dashboard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - os_dashboard_network
    restart: unless-stopped
    profiles:
      - full

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: os-dashboard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - os_dashboard_network
    restart: unless-stopped
    profiles:
      - full

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: os-dashboard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=osdashboard123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - os_dashboard_network
    restart: unless-stopped
    profiles:
      - full

  # File Browser for Data Management
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: os-dashboard-filebrowser
    ports:
      - "8080:80"
    volumes:
      - ./data:/srv/data
      - ./logs:/srv/logs
      - filebrowser_data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
    networks:
      - os_dashboard_network
    restart: unless-stopped
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  filebrowser_data:
    driver: local
  celery_beat_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  os_dashboard_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
