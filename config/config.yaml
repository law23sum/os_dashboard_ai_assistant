# Application configuration
app:
  name: "AI OS"
  version: "1.0.0"

# API rate limits and refresh intervals
api:
  refresh_interval: 300  # seconds
  rate_limits:
    openai: 100  # requests per minute
    google: 1000
    microsoft: 1000

# Logging configuration
logging:
  level: "INFO"
  file: "logs/app.log"

# Database configuration
database:
  type: "sqlite"
  path: "data/app.db"

# UI settings
ui:
  theme: "dark"

# Security Defense Orchestration (overrides default_config.yaml)
security_defense:
  auto_response_enabled: true
  active_enforcement: false
  auto_response_min_severity: "high"
  scan_interval_seconds: 120
