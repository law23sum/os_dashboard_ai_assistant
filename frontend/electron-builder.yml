appId: com.osdashboard.aiassistant
productName: AI OS Console
copyright: Copyright © 2024 AI OS
directories:
  output: dist-electron
  buildResources: electron/resources

files:
  - dist/**/*
  - electron/**/*
  - package.json

# macOS Configuration
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: electron/resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/resources/entitlements.mac.plist
  entitlementsInherit: electron/resources/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Windows Configuration
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
  icon: electron/resources/icon.ico
  publisherName: AI OS

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI OS
  installerIcon: electron/resources/icon.ico
  uninstallerIcon: electron/resources/icon.ico
  installerHeaderIcon: electron/resources/icon.ico
  license: LICENSE

# Linux Configuration
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: Office
  icon: electron/resources
  maintainer: AI OS Team
  vendor: AI OS
  synopsis: AI-powered dashboard and assistant
  description: A comprehensive AI assistant with dashboard, task management, and automation capabilities. Supports both web browser and desktop deployment.

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - libnss3
  packageCategory: utils

rpm:
  depends:
    - libnotify
    - libappindicator

# Publish configuration for auto-updates (optional)
publish:
  provider: generic
  url: https://releases.osdashboard.dev

# Build optimization
asar: true
compression: maximum

# Extra resources to include
extraResources:
  - from: ../backend_api
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
