<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI OS Console – Settings</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f7f9fc; }
    h1 { color: #0f172a; }
    section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(15,23,42,0.08); }
    label { display: block; font-weight: 600; margin: 16px 0 8px; }
    input, select { padding: 8px 12px; width: 100%; border: 1px solid #cbd5f5; border-radius: 6px; }
    .group-title { text-transform: uppercase; font-size: 12px; color: #475569; letter-spacing: 0.1em; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>AI OS Console Settings</h1>
  <p>Configure global behavior for the desktop/CLI suite.</p>

  <section>
    <div class="group-title">Authentication</div>
    <label for="persona">Default persona</label>
    <select id="persona">
      <option>Chris (conservative)</option>
      <option>AIC (systems)</option>
      <option>Aria (creative)</option>
      <option>Sora (ops)</option>
    </select>

    <label for="apiMode">AI mode</label>
    <select id="apiMode">
      <option>OpenAI</option>
      <option>Azure OpenAI</option>
      <option>Local LLAMA</option>
    </select>

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="sk-…" />
  </section>

  <section>
    <div class="group-title">Workspace & Sync</div>
    <label for="syncInterval">Sync interval</label>
    <select id="syncInterval">
      <option>15 minutes</option>
      <option>30 minutes</option>
      <option>60 minutes</option>
      <option>Manual only</option>
    </select>

    <label for="dataResidency">Data residency</label>
    <select id="dataResidency">
      <option>US</option>
      <option>EU</option>
      <option>APAC</option>
      <option>Multi-region</option>
    </select>

    <label for="notifications">Notifications</label>
    <select id="notifications">
      <option>All alerts</option>
      <option>Only critical</option>
      <option>Muted</option>
    </select>
  </section>

  <section>
    <div class="group-title">Automation defaults</div>
    <label for="daemonMode">Daemon posture</label>
    <select id="daemonMode">
      <option>Observe-only</option>
      <option>Assist (requires approval)</option>
      <option>Autonomous</option>
    </select>

    <label for="budget">Cost guardrail (per day)</label>
    <input id="budget" type="number" placeholder="50 USD" />

    <label for="auditMode">Audit notifications</label>
    <select id="auditMode">
      <option>Realtime (chat)</option>
      <option>Digest (daily)</option>
      <option>Disabled</option>
    </select>
  </section>
</body>
</html>
