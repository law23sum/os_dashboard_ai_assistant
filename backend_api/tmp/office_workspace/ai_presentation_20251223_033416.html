
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generated Presentation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #2c3e50;
            overflow: hidden;
        }
        
        .presentation-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        .slide {
            width: 100%;
            height: 100%;
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s ease-in-out;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0);
        }
        
        .slide.prev {
            transform: translateX(-100%);
        }
        
        .slide h1 {
            font-family: Georgia, serif;
            font-size: 3em;
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .slide h2 {
            font-family: Georgia, serif;
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        
        .slide h3 {
            font-size: 1.8em;
            color: #3498db;
            margin-bottom: 20px;
        }
        
        .slide p, .slide li {
            font-size: 1.3em;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .slide ul {
            list-style: none;
            padding-left: 0;
        }
        
        .slide li {
            position: relative;
            padding-left: 30px;
            margin-bottom: 10px;
        }
        
        .slide li:before {
            content: "▶";
            color: #3498db;
            position: absolute;
            left: 0;
        }
        
        .two-column {
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .column {
            flex: 1;
            padding: 0 30px;
        }
        
        .chart-container {
            width: 80%;
            height: 60%;
            margin: 20px auto;
        }
        
        .image-container {
            max-width: 50%;
            max-height: 60%;
            margin: 20px;
        }
        
        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .navigation {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        
        .nav-btn {
            padding: 12px 24px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover {
            background: #3498db;
            transform: translateY(-2px);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .slide-counter {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .title-slide {
            text-align: center;
        }
        
        .title-slide .subtitle {
            font-size: 1.8em;
            color: #3498db;
            margin-bottom: 40px;
        }
        
        .title-slide .author {
            font-size: 1.2em;
            color: #2c3e50;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .slide {
                padding: 30px 20px;
            }
            
            .slide h1 {
                font-size: 2.2em;
            }
            
            .slide h2 {
                font-size: 1.8em;
            }
            
            .two-column {
                flex-direction: column;
            }
            
            .chart-container {
                width: 95%;
                height: 50%;
            }
        }
    </style>
</head>
<body>
    <div class="presentation-container">
        
        <div class="slide center-layout active" data-slide="0">
            
                <div class="title-slide">
                    <h1>Executive Summary</h1>
                    
                        <div class="subtitle">Automated content</div>
                    
                    
                        <div class="author">AI Assistant</div>
                    
                    
                        <div class="author">December 22, 2025</div>
                    
                </div>
            
        </div>
        
        <div class="slide default-layout " data-slide="1">
            
                <h2>Overview</h2>
                
                    
                        
                            <p>Key updates</p>
                        
                    
                        
                            <p>Goals</p>
                        
                    
                        
                            <p>KPIs</p>
                        
                    
                
            
        </div>
        
        <div class="slide default-layout " data-slide="2">
            
                <h2>Highlights</h2>
                
                    
                        
                            <p>Revenue growth</p>
                        
                    
                        
                            <p>Customer wins</p>
                        
                    
                        
                            <p>Next steps</p>
                        
                    
                
            
        </div>
        
    </div>
    
    
    <div class="navigation">
        <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">Previous</button>
        <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Next</button>
    </div>
    
    <div class="slide-counter">
        <span id="currentSlide">1</span> / <span id="totalSlides">3</span>
    </div>
    
    
    <script>
        let currentSlideIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        
        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.remove('active', 'prev');
                if (i === index) {
                    slide.classList.add('active');
                } else if (i < index) {
                    slide.classList.add('prev');
                }
            });
            
            document.getElementById('currentSlide').textContent = index + 1;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === totalSlides - 1;
        }
        
        function changeSlide(direction) {
            const newIndex = currentSlideIndex + direction;
            if (newIndex >= 0 && newIndex < totalSlides) {
                currentSlideIndex = newIndex;
                showSlide(currentSlideIndex);
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });
        
        // Initialize charts
        
        
        
        
        
        
        
        
        // Initialize presentation
        showSlide(0);
        
        // GSAP animations
        gsap.from('.slide.active h1, .slide.active h2', {
            duration: 1,
            y: 50,
            opacity: 0,
            ease: "power2.out"
        });
    </script>
</body>
</html>
