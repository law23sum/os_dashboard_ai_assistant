version: '3.8'

# Development Docker Compose
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down -v

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: osdash-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=dev
      - DEBUG=true
      - DATABASE_URL=sqlite:///data/assistant_hub.db
    env_file:
      - .env
      - env.dev.example
    command: uvicorn assistant_hub.api.server:create_app --factory --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - osdash-network
    stop_grace_period: 10s

  # Frontend (Vite Dev Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: osdash-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=/api
      - VITE_API_TARGET=http://backend:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - osdash-network
    stop_grace_period: 10s

  # PostgreSQL (for alpha/production-like testing)
  postgres:
    image: postgres:15-alpine
    container_name: osdash-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=osdash
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=osdash_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osdash"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osdash-network

  # Redis (for caching and queues)
  redis:
    image: redis:7-alpine
    container_name: osdash-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - osdash-network

  # Test Runner
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: osdash-test-runner
    volumes:
      - .:/app
      - ./test-results:/app/test-results
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=sqlite:///data/test.db
    env_file:
      - .env.local
    command: pytest tests/ -v --cov=backend_api --cov-report=html
    depends_on:
      - postgres
      - redis
    networks:
      - osdash-network
    profiles:
      - test

networks:
  osdash-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
