apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: osdash-secrets
  namespace: osdash-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: osdash-secrets-store
    kind: ClusterSecretStore
  target:
    name: osdash-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: osdash/prod/openai_api_key
    - secretKey: SENTRY_DSN
      remoteRef:
        key: osdash/prod/sentry_dsn
