apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: osdash-staging

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

images:
  - name: osdash-backend
    newName: ghcr.io/law23sum/os_dashboard_ai_assistant/backend
    newTag: staging
  - name: osdash-frontend
    newName: ghcr.io/law23sum/os_dashboard_ai_assistant/frontend
    newTag: staging

configMapGenerator:
  - name: osdash-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO

generatorOptions:
  disableNameSuffixHash: true
