apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: replicas.yaml

images:
  - name: osdash-backend
    newName: ghcr.io/law23sum/os_dashboard_ai_assistant/backend
    newTag: preview
  - name: osdash-frontend
    newName: ghcr.io/law23sum/os_dashboard_ai_assistant/frontend
    newTag: preview

configMapGenerator:
  - name: osdash-config
    behavior: merge
    literals:
      - ENVIRONMENT=preview
      - LOG_LEVEL=DEBUG

generatorOptions:
  disableNameSuffixHash: true
